<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>SIP Status Diagram</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="860" height="300" fill="#ffffff"/>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <!-- main track -->
    <path d="M120,60 H170"/>
    <path d="M270,60 H320"/>
    <path d="M420,60 H470"/>
    <path d="M570,60 H620"/>
    <!-- Last Call back to Review -->
    <path d="M520,82 C520,120 370,120 370,84"/>
    <!-- to Stagnant -->
    <path d="M220,82 L360,200"/>
    <path d="M370,82 L370,200"/>
    <path d="M520,82 L380,200"/>
    <!-- Stagnant back to Draft -->
    <path d="M330,215 C230,215 205,150 210,84"/>
    <!-- to Withdrawn -->
    <path d="M240,82 L560,200"/>
    <path d="M390,82 L570,200"/>
    <path d="M540,82 L580,200"/>
  </g>
  <g stroke="#444" stroke-width="1.5">
    <rect x="20" y="40" width="100" height="40" rx="6" fill="#f3f3f3" stroke-dasharray="5 4"/>
    <rect x="170" y="40" width="100" height="40" rx="6" fill="#e8f0fe"/>
    <rect x="320" y="40" width="100" height="40" rx="6" fill="#e8f0fe"/>
    <rect x="470" y="40" width="100" height="40" rx="6" fill="#fff4e0"/>
    <rect x="620" y="40" width="100" height="40" rx="6" fill="#e6f4ea"/>
    <rect x="330" y="200" width="100" height="40" rx="6" fill="#f3f3f3"/>
    <rect x="530" y="200" width="100" height="40" rx="6" fill="#fde8e8"/>
    <rect x="740" y="140" width="100" height="40" rx="6" fill="#e6f4ea"/>
  </g>
  <g fill="#111" text-anchor="middle" dominant-baseline="middle">
    <text x="70" y="60">Idea</text>
    <text x="220" y="60">Draft</text>
    <text x="370" y="60">Review</text>
    <text x="520" y="60">Last Call</text>
    <text x="670" y="60">Final</text>
    <text x="380" y="220">Stagnant</text>
    <text x="580" y="220">Withdrawn</text>
    <text x="790" y="160">Living</text>
  </g>
  <g fill="#555" font-size="12" text-anchor="middle">
    <text x="445" y="130">normative changes</text>
    <text x="430" y="270">6 months of inactivity → Stagnant; resurrected by moving back to Draft or its earlier status</text>
  </g>
</svg>
