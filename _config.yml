title: Sila Protocol Specifications
description: Draft and published specifications for the Sila network
url: https://sips.silachain.org
baseurl: ""
markdown: kramdown
encoding: utf-8
plugins:
  - jekyll-relative-links

# Publication is a separate owner-controlled operation. This build only tests
# the draft content on the authorized work branch.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - audit
  - tests
  - tools
  - vendor
  - node_modules
  - .github
  - .gitignore
  - .gitattributes
  - _site

defaults:
  - scope:
      path: "SIPS"
      type: pages
    values:
      layout: sip
