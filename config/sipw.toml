[[modifiers]]
kind = "set-default-annotation"
name = "status"
value = "Stagnant"
annotation_level = "warning"

[[modifiers]]
kind = "set-default-annotation"
name = "status"
value = "Withdrawn"
annotation_level = "warning"

[lints.markdown-re-sip-dash]
kind = "markdown-regex"
mode = "excludes"
pattern = '(?i)sip[\s]*[0-9]+'
message = "proposals must be referenced with the form `SIP-N` (not `SIPN` or `SIP N`)"

[lints.preamble-date-created]
kind = "preamble-date"
name = "created"

[lints.preamble-re-description-sip-dash]
kind = "preamble-regex"
name = "description"
mode = "excludes"
pattern = '(?i)sip[\s]*[0-9]+'
message = "proposals must be referenced with the form `SIP-N` (not `SIPN` or `SIP N`)"

[lints.preamble-re-description-colon]
kind = "preamble-regex"
name = "description"
mode = "excludes"
pattern = ":"
message = "preamble header `description` should not contain `:`"

[lints.preamble-refs-description]
kind = "preamble-proposal-ref"
name = "description"

[lints.preamble-enum-category]
kind = "preamble-one-of"
name = "category"
values = [
    "Core",
    "Networking",
    "Interface",
    "SRC",
]

[lints.preamble-re-description]
kind = "preamble-regex"
name = "description"
mode = "excludes"
pattern = '(?i)standar\w*\b'
message = "preamble header `description` should not contain `standard` (or similar words.)"

[lints.preamble-re-title-src-dash]
kind = "preamble-regex"
name = "title"
mode = "excludes"
pattern = '(?i)src[\s]*[0-9]+'
message = "proposals must be referenced with the form `SRC-N` (not `SRCN` or `SRC N`)"

[lints.preamble-re-description-src-dash]
kind = "preamble-regex"
name = "description"
mode = "excludes"
pattern = '(?i)src[\s]*[0-9]+'
message = "proposals must be referenced with the form `SRC-N` (not `SRCN` or `SRC N`)"


[lints.markdown-refs]
kind = "markdown-proposal-ref"

[lints.preamble-req-withdrawal-reason]
kind = "preamble-required-if-eq"
when = "status"
equals = "Withdrawn"
then = "withdrawal-reason"

[lints.preamble-order]
kind = "preamble-order"
names = [
    "sip",
    "title",
    "description",
    "author",
    "discussions-to",
    "status",
    "last-call-deadline",
    "type",
    "category",
    "created",
    "requires",
    "withdrawal-reason",
]


[lints.preamble-requires-status]
kind = "preamble-requires-status"
requires = "requires"
status = "status"
flow = [
    [
        "Draft",
        "Stagnant",
    ],
    ["Review"],
    ["Last Call"],
    [
        "Final",
        "Withdrawn",
        "Living",
    ],
]

[lints.markdown-order-section]
kind = "markdown-section-order"
sections = [
    "Abstract",
    "Motivation",
    "Specification",
    "Rationale",
    "Backwards Compatibility",
    "Test Cases",
    "Reference Implementation",
    "Security Considerations",
    "Copyright",
]

[lints.markdown-rel-links]
kind = "markdown-relative-links"
exceptions = [
    '^https://github\.com/sila-network/SIPs/(blob|tree)/[a-f0-9]{40}/.+$',
    '^https://github\.com/sila-network/SIPs/commit/[a-f0-9]{40}$',
    '^https://www\.w3\.org/TR/[0-9][0-9][0-9][0-9]/.*$',
    '^https://[a-z]*\.spec\.whatwg\.org/commit-snapshots/[0-9a-f]{40}/$',
    '^https://www\.rfc-editor\.org/rfc/.*$',
    '^https://www\.unicode\.org/reports/tr[0-9]+/tr[0-9]+-[0-9]+\.html$',
]

[lints.preamble-req-category]
kind = "preamble-required-if-eq"
when = "type"
equals = "Standards Track"
then = "category"

[lints.preamble-sip]
kind = "preamble-uint"
name = "sip"

# Use the complete built-in CSL citation schema of pinned Sila sipw.
[lints.preamble-no-dup]
kind = "preamble-no-duplicates"

[lints.preamble-requires-ref-description]
kind = "preamble-require-referenced"
name = "description"
requires = "requires"

[lints.preamble-re-title]
kind = "preamble-regex"
name = "title"
mode = "excludes"
pattern = '(?i)standar\w*\b'
message = "preamble header `title` should not contain `standard` (or similar words.)"

[lints.preamble-re-title-sip-dash]
kind = "preamble-regex"
name = "title"
mode = "excludes"
pattern = '(?i)sip[\s]*[0-9]+'
message = "proposals must be referenced with the form `SIP-N` (not `SIPN` or `SIP N`)"

[lints.preamble-date-last-call-deadline]
kind = "preamble-date"
name = "last-call-deadline"

[lints.markdown-req-section]
kind = "markdown-section-required"
sections = [
    "Abstract",
    "Specification",
    "Rationale",
    "Security Considerations",
    "Copyright",
]

[lints.markdown-link-status]
pattern = "(?i)(?:sip|src)-([0-9]+).md$"
kind = "markdown-link-status"
status = "status"
flow = [
    [
    "Draft",
    "Stagnant",
],
    ["Review"],
    ["Last Call"],
    [
    "Final",
    "Withdrawn",
    "Living",
    "Moved",
],
]

[lints.preamble-re-title-colon]
kind = "preamble-regex"
name = "title"
mode = "excludes"
pattern = ":"
message = "preamble header `title` should not contain `:`"

[lints.preamble-list-requires]
kind = "preamble-list"
name = "requires"

[lints.preamble-len-description]
kind = "preamble-length"
name = "description"
min = 2
max = 140

[lints.preamble-requires-ref-title]
kind = "preamble-require-referenced"
name = "title"
requires = "requires"

[lints.markdown-html-comments]
kind = "markdown-html-comments"
name = "status"
warn_for = [
    "Draft",
    "Withdrawn",
]

[lints.preamble-author]
kind = "preamble-author"
name = "author"

[lints.preamble-uint-requires]
kind = "preamble-uint-list"
name = "requires"

[lints.preamble-len-requires]
kind = "preamble-length"
name = "requires"
min = 1

[lints.markdown-link-first]
kind = "markdown-link-first"
pattern = "(?i)(?:sip|src)-([0-9]+)"

[lints.markdown-re-src-dash]
kind = "markdown-regex"
mode = "excludes"
pattern = '(?i)src[\s]*[0-9]+'
message = "proposals must be referenced with the form `SRC-N` (not `SRCN` or `SRC N`)"

[lints.preamble-list-author]
kind = "preamble-list"
name = "author"

[lints.preamble-enum-type]
kind = "preamble-one-of"
name = "type"
values = [
    "Standards Track",
    "Meta",
    "Informational",
]

[lints.preamble-len-title]
kind = "preamble-length"
name = "title"
min = 2
max = 44

[lints.preamble-discussions-to]
kind = "preamble-url"
name = "discussions-to"

[lints.preamble-req]
kind = "preamble-required"
names = [
    "sip",
    "title",
    "description",
    "author",
    "status",
    "type",
    "created",
]

[lints.preamble-re-discussions-to]
kind = "preamble-regex"
name = "discussions-to"
mode = "includes"
pattern = "^https://sila-magicians\\.discourse\\.group/t/[^/]+/[0-9]+$"
message = "preamble header `discussions-to` should point to a thread on sila-magicians.discourse.group"

[lints.preamble-refs-title]
kind = "preamble-proposal-ref"
name = "title"

[lints.preamble-enum-status]
kind = "preamble-one-of"
name = "status"
values = [
    "Draft",
    "Review",
    "Last Call",
    "Final",
    "Stagnant",
    "Withdrawn",
    "Living",
]

[lints.preamble-trim]
kind = "preamble-trim"

[lints.preamble-req-last-call-deadline]
kind = "preamble-required-if-eq"
when = "status"
equals = "Last Call"
then = "last-call-deadline"

[lints.preamble-file-name]
kind = "preamble-file-name"
name = "sip"
format = "sip-{}"

[lints.markdown-no-backticks]
kind = "markdown-no-backticks"
pattern = "(?i)(sip|src)-[0-9]+"

[lints.markdown-headings-space]
kind = "markdown-headings-space"

[lints.markdown-copyright]
kind = "markdown-section-text"
section = "Copyright"
level = 2
exactly = "Copyright and related rights waived via [CC0](../LICENSE.md)."

# [lints.markdown-spell]
# kind = "markdown-spell"
# personal_dictionary = """
# GiB
# Glamsterdam
# MiB
# Perfnet
# """

[lints.markdown-heading-first]
kind = "markdown-heading-first"

[lints.markdown-no-smart-quotes]
kind = "markdown-regex"
mode = "excludes"
pattern = '[\u{201C}\u{201D}]|[\u{2018}\u{2019}]'
message = "smart quotes are not allowed (use straight quotes instead)"

[fetch]
proposal-format = "sip-{}"
